# HTTPS vhost for td.1tlt.ru
# Certificates expected at standard Let's Encrypt paths:
#   /etc/letsencrypt/live/td.1tlt.ru/fullchain.pem
#   /etc/letsencrypt/live/td.1tlt.ru/privkey.pem
#
# Install: sudo cp deploy/apache/td.1tlt.ru-le-ssl.conf /etc/apache2/sites-available/
#          sudo a2ensite td.1tlt.ru-le-ssl.conf
# Requires: a2enmod ssl rewrite headers proxy proxy_fcgi
# PHP-FPM: 127.0.0.1:9072 (/usr/local/php82)

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName td.1tlt.ru
    DocumentRoot /ssd/www/tradesignals/public
    DirectoryIndex index.php

    <Directory /ssd/www/tradesignals/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Explicit SCRIPT_FILENAME — надёжнее SetHandler на custom PHP-FPM
    ProxyPassMatch ^/(.*\.php(/.*)?)$ fcgi://127.0.0.1:9072/ssd/www/tradesignals/public/$1

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/td.1tlt.ru/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/td.1tlt.ru/privkey.pem
    # Include optional chain options if present on the host
    IncludeOptional /etc/letsencrypt/options-ssl-apache.conf

    ErrorLog ${APACHE_LOG_DIR}/td.1tlt.ru-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/td.1tlt.ru-ssl-access.log combined
</VirtualHost>
</IfModule>
