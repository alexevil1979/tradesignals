# HTTP → HTTPS redirect for td.1tlt.ru
# Install: sudo cp deploy/apache/td.1tlt.ru.conf /etc/apache2/sites-available/
#          sudo a2ensite td.1tlt.ru.conf

<VirtualHost *:80>
    ServerName td.1tlt.ru
    DocumentRoot /ssd/www/tradesignals/public

    <Directory /ssd/www/tradesignals/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # ACME HTTP-01 (certbot renew) — allow challenge without redirect
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [L,R=301]

    ErrorLog ${APACHE_LOG_DIR}/td.1tlt.ru-error.log
    CustomLog ${APACHE_LOG_DIR}/td.1tlt.ru-access.log combined
</VirtualHost>
